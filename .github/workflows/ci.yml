name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff lint
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: pytest
        run: pytest --cov=services --cov-report=term-missing

  terraform:
    name: terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -recursive -check -diff infra

      - name: validate bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: validate dev
        working-directory: infra/envs/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: validate prod
        working-directory: infra/envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: validate local
        working-directory: infra/envs/local
        run: |
          terraform init -input=false
          terraform validate

  diagram:
    name: diagram is up to date
    runs-on: ubuntu-latest
    env:
      D2_VERSION: v0.9.0
      D2_SHA256: 5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9
    steps:
      - uses: actions/checkout@v5

      - name: install D2
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo d2.tar.gz "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz"
          echo "${D2_SHA256}  d2.tar.gz" | sha256sum -c
          tar -xzf d2.tar.gz
          echo "$PWD/d2-${D2_VERSION}/bin" >> "$GITHUB_PATH"

      # Renders docs/diagrams/architecture.d2 again (fetching its icons) and
      # fails if the result differs from the committed SVG.
      - name: render and compare
        run: |
          d2 docs/diagrams/architecture.d2 docs/architecture.svg
          git diff --exit-code --stat -- docs/architecture.svg

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The image bundles shellcheck, which also checks the run: scripts.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
