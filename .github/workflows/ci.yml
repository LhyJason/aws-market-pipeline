name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff lint
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: pytest
        run: pytest --cov=services --cov-report=term-missing

  terraform:
    name: terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -recursive -check -diff infra

      - name: validate bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: validate dev
        working-directory: infra/envs/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: validate local
        working-directory: infra/envs/local
        run: |
          terraform init -input=false
          terraform validate
