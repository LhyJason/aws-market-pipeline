[project]
name = "aws-market-pipeline"
version = "0.1.0"
description = "Serverless real-time market data pipeline on AWS"
requires-python = ">=3.12"
readme = "README.md"

# Runtime dependencies live per service (services/*/requirements.txt) so each
# Lambda package stays minimal. Dev tooling is in requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/producer/src", "services/processor/src", "services/api/src", "scripts"]
# Integration tests are deselected by default (CI, make test); make
# test-integration selects them with -m "integration and not chaos" and
# RUN_INTEGRATION=1, and make test-chaos the chaos tests with -m chaos.
addopts = "-ra -q --strict-markers -m 'not integration'"
markers = [
  "integration: hits a deployed stack, LocalStack by default (needs RUN_INTEGRATION=1)",
  "chaos: injects failures into a deployed stack and restores it (LocalStack unless ALLOW_CHAOS_ON_AWS=1)",
]
filterwarnings = [
  # Mangum 0.22 calls asyncio.get_event_loop() when created; harmless on 3.12.
  "ignore:There is no current event loop:DeprecationWarning:mangum.adapter",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services/producer/src", "services/processor/src", "services/api/src", "scripts", "tests"]
extend-exclude = [".venv", ".build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["producer", "processor", "api", "query_lake", "build_lambda", "load_report", "load_test"]

[tool.coverage.run]
source = ["services"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
